name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '테스트 빌드 버전 (예: 1.0.9) — 릴리스는 만들지 않음'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart('v') }
          elseif ("${{ inputs.version }}") { $v = "${{ inputs.version }}" }
          else { $v = "0.0.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: >
          dotnet publish src/MxCam/MxCam.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none -p:Version=${{ steps.ver.outputs.version }} -o out

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /Qp "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DSourceExe=$PWD\out\MxCam.exe" "/DOutputDir=$PWD\out" installer\MxCam.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem out -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content "$($_.FullName).sha256" "$h  $($_.Name)" -NoNewline
          }
          Get-ChildItem out | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: MxCam-${{ steps.ver.outputs.version }}
          path: out/*

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = Get-ChildItem out -File | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" @files --title "MxCam ${{ github.ref_name }}" --generate-notes
